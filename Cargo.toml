[package]
name = "tvbox-wc"
version = "0.1.9"
edition = "2021"
rust-version = "1.85"
description = "Wayland compositor for the tvbox: the display engine composes, not the GPU"
repository = "https://github.com/Andy1210/tvbox-wc"
license = "MIT"
keywords = ["wayland", "compositor", "smithay", "raspberry-pi", "kms"]
categories = ["gui"]

[dependencies]
anyhow = "1.0"
# Same calloop smithay re-exports (features are additive, so this just turns on the
# signal source there too). SIGTERM has to end the loop rather than the process:
# the session runs in its own process group and only the compositor's own shutdown
# path stops it.
calloop = { version = "0.14", features = ["signals"] }
libc = "0.2"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned to a revision rather than a release: the DRM compositor's plane
# assignment is what this project is built on, and it moves. Bump deliberately,
# and re-run tools/gpuprobe.sh afterwards.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
]

[profile.release]
debug = "line-tables-only"

# The Pi's 10-bit decoder output is P030, and the last drm-fourcc release (2.2.0,
# 2021) has no such variant, so smithay drops the format when it reads a plane's
# IN_FORMATS and 10-bit video can never reach a plane. It was added upstream when
# the enums were regenerated on 6.15.9; there has been no release since
# (danielzfranklin/drm-fourcc-rs#31). Drop this once one lands.
[patch.crates-io]
drm-fourcc = { git = "https://github.com/danielzfranklin/drm-fourcc-rs", rev = "1ad1a978a9aaa78ff0016cc7013787e4d1d68682" }
